<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Codex Castor Monitor</title>
<style>
  :root {
    color-scheme: light;
    --paper: #f4e8cd;
    --card: #fcf2dc;
    --ink: #241912;
    --muted: #604b39;
    --line: #b9a480;
    --accent: #274c5b;
    --rubric: #8f2d22;
    --mono: ui-monospace, "SF Mono", Consolas, monospace;
    background: var(--color-background-primary, var(--paper));
    color: var(--color-text-primary, var(--ink));
    font: 14px/1.45 var(--font-sans, system-ui, sans-serif);
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --paper: #241f1d;
    --card: #2d2926;
    --ink: #f2e7d5;
    --muted: #d0bca6;
    --line: #675649;
    --accent: #9bcfdf;
    --rubric: #f3aa99;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; }
  main { max-width: 1280px; margin-inline: auto; padding: clamp(14px, 3vw, 40px); }
  h1, h2, h3, p { margin: 0; }
  .masthead {
    border-top: 3px double var(--color-border-primary, var(--line));
    border-bottom: 1px solid var(--color-border-primary, var(--line));
    padding: 12px 0 13px;
  }
  .masthead, .toolbar, .controls, .task-head, .model, .details {
    display: flex; flex-wrap: wrap; align-items: center; gap: 7px 11px;
  }
  .masthead, .toolbar { justify-content: space-between; }
  h1 { font: 600 clamp(1.65rem, 4vw, 2.4rem)/1 Georgia, serif; letter-spacing: -.035em; }
  .counts, .stamp, .clock, .badge, .details, .feed time, .round { font-family: var(--mono); }
  .counts { color: var(--color-text-secondary, var(--muted)); font-size: .8rem; }
  .counts strong { color: var(--accent); }
  .toolbar { padding-block: 12px; }
  button {
    min-height: 32px; padding: 4px 9px; cursor: pointer; border-radius: 4px;
    border: 1px solid var(--color-border-primary, var(--line));
    background: var(--color-background-secondary, var(--card)); color: inherit; font: inherit;
    font-size: .78rem; font-weight: 600;
  }
  button:hover { border-color: var(--accent); color: var(--accent); }
  button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
  button:disabled, button[aria-disabled="true"] { opacity: .6; cursor: default; }
  .views { display: flex; gap: 4px; margin-inline-end: 6px; }
  .views button[aria-pressed="true"] { background: var(--accent); color: var(--paper); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #notice { margin: 0 0 12px; font-size: .83rem; color: var(--rubric); }
  .section + .section { margin-top: 22px; }
  .section h2 {
    font-size: .72rem; text-transform: uppercase; letter-spacing: .105em; margin-bottom: 8px;
    color: var(--color-text-secondary, var(--muted)); font-weight: 700;
  }
  .grid { display: grid; gap: 10px; grid-template-columns: minmax(0, 1fr); }
  .task {
    min-width: 0; align-self: start; overflow-wrap: anywhere; padding: 13px;
    background: var(--color-background-secondary, var(--card));
    border: 1px solid var(--color-border-primary, var(--line)); border-radius: 6px;
    box-shadow: 0 1px 2px #20140d16; border-inline-start: 3px solid var(--color-border-primary, var(--line));
  }
  .task.is-live { border-inline-start-color: var(--accent); }
  .task-head { flex-wrap: nowrap; gap: 7px; }
  .task-head h3 { flex: 1; min-width: 0; font-size: 1rem; line-height: 1.2; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; flex: none; color: var(--muted); }
  .is-live .dot { color: var(--accent); animation: pulse 2.4s ease-out infinite; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 4px color-mix(in srgb, currentColor 20%, transparent); } }
  .round { color: var(--color-text-secondary, var(--muted)); font-size: .74rem; }
  .clock { font-size: .87rem; color: var(--accent); white-space: nowrap; font-weight: 700; }
  .model { gap: 5px; margin-top: 10px; }
  .badge, .stamp {
    padding: 2px 5px; border-radius: 3px; border: 1px solid var(--color-border-primary, var(--line));
    font-size: .72rem; color: var(--color-text-secondary, var(--muted));
  }
  .model-value { font-weight: 700; color: var(--accent); }
  .override, .cancel { color: var(--rubric); }
  .task-summary { margin-top: 8px; font-size: .85rem; }
  .details {
    margin-top: 9px; justify-content: space-between; align-items: flex-start;
    gap: 3px 8px; font-size: .75rem; color: var(--color-text-secondary, var(--muted));
  }
  .activity {
    margin-top: 9px; padding: 7px 8px; border-inline-start: 2px solid var(--accent);
    background: var(--color-background-primary, var(--paper)); font-size: .84rem;
  }
  .activity strong { display: block; color: var(--accent); font-size: .74rem; margin-bottom: 2px; }
  .feed { margin-top: 9px; font-size: .8rem; }
  .feed summary { width: fit-content; cursor: pointer; font-weight: 650; }
  .feed ol { padding: 0; margin: 5px 0 0; list-style: none; }
  .feed li { display: grid; grid-template-columns: 8ch minmax(0, 1fr); gap: 7px; padding: 4px 0; }
  .feed li + li { border-top: 1px dotted var(--color-border-primary, var(--line)); }
  .feed time { color: var(--color-text-secondary, var(--muted)); font-size: .71rem; }
  .task-footer { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 9px; }
  .state-label { font-size: .75rem; text-transform: capitalize; color: var(--color-text-secondary, var(--muted)); }
  .cancel[aria-pressed="true"] { border-color: var(--rubric); color: var(--rubric); }
  .empty { padding: 20px 12px; text-align: center; color: var(--color-text-secondary, var(--muted)); }
  .feedback-form {
    display: grid; gap: 6px; margin-top: 10px; padding-top: 9px;
    border-top: 1px dotted var(--color-border-primary, var(--line));
  }
  .feedback-row { display: flex; flex-wrap: wrap; align-items: center; gap: 5px 7px; }
  .feedback-stars { display: inline-flex; gap: 3px; }
  .feedback-stars button { min-width: 26px; padding: 0 3px; font-size: 1.05rem; }
  .feedback-form :is(input, select) {
    min-height: 32px; min-width: 0; padding: 4px 6px; color: inherit;
    border: 1px solid var(--color-border-primary, var(--line)); border-radius: 4px;
    background: var(--color-background-primary, var(--paper)); font: inherit; font-size: .78rem;
  }
  .feedback-form input { flex: 1; }
  .feedback-form input::placeholder { color: var(--color-text-secondary, var(--muted)); }
  .feedback-status, .first-reply, .export-hint {
    color: var(--color-text-secondary, var(--muted)); font-size: .75rem;
  }
  .feedback-status[data-error="true"] { color: var(--rubric); }
  .kpis {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 12px 16px;
    margin: 0 0 22px; padding: 12px 0; border-block: 1px solid var(--color-border-primary, var(--line));
  }
  .kpis dt { color: var(--color-text-secondary, var(--muted)); font-size: .76rem; }
  .kpis dd { margin: 3px 0 0; color: var(--accent); font: 700 1.1rem/1.2 var(--mono); }
  .table-scroll { overflow-x: auto; }
  .analytics-table { width: 100%; border-collapse: collapse; font-size: .82rem; white-space: nowrap; }
  .analytics-table :is(th, td) {
    padding: 9px 12px; text-align: start; border-bottom: 1px solid var(--color-border-primary, var(--line));
  }
  .analytics-table thead { background: var(--color-background-secondary, var(--card)); }
  .analytics-table :is(th, td):nth-child(n+3) { text-align: end; font-variant-numeric: tabular-nums; }
  .export-hint { margin-top: 14px; overflow-wrap: anywhere; }
  .export-hint code { font-family: var(--mono); }
  @media (min-width: 720px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (min-width: 1120px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  @media (min-width: 960px) {
    #tasks:has(.section + .section) {
      display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr);
      align-items: start; gap: 22px;
    }
    #tasks:has(.section + .section) .section + .section { margin-top: 0; }
    #tasks:has(.section + .section) .grid { grid-template-columns: minmax(0, 1fr); }
  }
  @media (prefers-reduced-motion: reduce) { .is-live .dot { animation: none; } }
</style>
</head>
<body>
<main>
  <header class="masthead">
    <h1>Codex Castor Monitor</h1>
    <div class="counts"><strong id="active">0 active</strong> · <span id="total">0 total</span></div>
  </header>
  <div class="toolbar">
    <div class="controls" aria-label="Monitor controls">
      <div class="views" role="group" aria-label="View">
        <button type="button" id="show-tasks" aria-controls="tasks" aria-pressed="true">Tasks</button>
        <button type="button" id="show-analytics" aria-controls="analytics" aria-pressed="false">Analytics</button>
      </div>
      <button type="button" id="filter" aria-pressed="false">Active only</button>
      <button type="button" id="pause" aria-pressed="false">Pause</button>
      <button type="button" id="refresh">Refresh</button>
    </div>
    <span class="stamp" id="preview" hidden>Preview mode</span>
  </div>
  <p id="notice" role="status" hidden></p>
  <div id="tasks"></div>
  <div id="analytics" hidden></div>
</main>
<script>
"use strict";

const protocol = "2026-01-26";
const parentWindow = window.parent;
const preview = parentWindow === window || new URLSearchParams(window.location.search).get("demo") === "1";
const byId = id => document.getElementById(id);
const tasksView = byId("tasks");
const analyticsView = byId("analytics");
const refreshButton = byId("refresh");
const pending = new Map();
const feedState = new Map();
const feedbackDrafts = new Map();
const savingFeedback = new Set();
const feedbackMessages = new Map();
const clocks = [];
let nextId = 2;
let parentOrigin = "*";
let ready = false;
let disposed = false;
let paused = false;
let activeOnly = false;
let selected = "";
let count = 0;
let total = 0;
let tasks = [];
let analytics;
let telemetryDir = "~/.gemini/codex-castor";
let view = "tasks";
let taskRenderPending = false;
let confirmTask = null;
let cancelling = null;
let pollTimer;
let tickTimer;
let resizeObserver;
let refreshInFlight = false;
let refreshQueued = false;
let generation = 0;
let receivedResult = false;

function post(message) {
  parentWindow.postMessage({jsonrpc: "2.0", ...message}, parentOrigin);
}

function call(name, args) {
  const id = nextId++;
  return new Promise((resolve, reject) => {
    const timeout = setTimeout(() => {
      pending.delete(id);
      post({method: "notifications/cancelled", params: {requestId: id, reason: "Request timed out"}});
      reject(new Error("Request timed out"));
    }, 15000);
    pending.set(id, {resolve, reject, timeout});
    post({id, method: "tools/call", params: {name, arguments: args}});
  });
}

function hostContext(context) {
  const root = document.documentElement;
  if (context?.theme === "dark" || context?.theme === "light") root.dataset.theme = context.theme;
  for (const [key, value] of Object.entries(context?.styles?.variables ?? {})) {
    if (key.startsWith("--")) {
      if (typeof value === "string") root.style.setProperty(key, value);
      else if (value === null) root.style.removeProperty(key);
    }
  }
}

function toolPayload(result) {
  if (result?.structuredContent) return result.structuredContent;
  const text = result?.content?.[0]?.text;
  try { return JSON.parse(text); } catch { return null; }
}

function showNotice(text) {
  byId("notice").textContent = text;
  byId("notice").hidden = !text;
}

function live(task) {
  return (task.status === "running" || task.status === "starting") && task.alive !== false;
}

function sameRound(task, other) {
  return task.task_id === other?.task_id && task.round === other.round;
}

function setSnapshot(data) {
  if (!data || !Array.isArray(data.tasks)) return false;
  const now = performance.now();
  tasks = data.tasks.slice();
  if (data.selected_task && !tasks.some(task => task.task_id === data.selected_task.task_id)) {
    tasks.push(data.selected_task);
  }
  const serverTime = Date.parse(data.server_time);
  tasks = tasks.map(task => {
    const start = Date.parse(task.round_started_at || task.created_at);
    const end = live(task) ? serverTime : Date.parse(task.finished_at || task.updated_at);
    const fallback = Number.isFinite(end - start) ? (end - start) / 1000 : 0;
    return {...task, receivedAt: now, elapsed: Math.max(0, task.elapsed_seconds ?? fallback)};
  });
  count = data.active_count ?? tasks.filter(live).length;
  total = data.total ?? tasks.length;
  analytics = data.analytics;
  telemetryDir = data.telemetry_dir || telemetryDir;
  receivedResult = true;
  if (!tasks.some(task => sameRound(task, confirmTask) && live(task))) confirmTask = null;
  render(undefined, true);
  return true;
}

function schedule() {
  clearTimeout(pollTimer);
  if (ready && !preview && !disposed && !paused && !refreshInFlight) {
    pollTimer = setTimeout(refresh, count > 0 ? 2000 : 8000);
  }
}

async function refresh() {
  if (preview) { render(); return; }
  if (!ready || disposed) return;
  if (refreshInFlight) { refreshQueued = true; return; }
  clearTimeout(pollTimer);
  refreshInFlight = true;
  refreshButton.disabled = true;
  const requestGeneration = generation;
  try {
    const args = selected ? {limit: 20, task_id: selected} : {limit: 20};
    const result = await call("codex_monitor", args);
    if (disposed || requestGeneration !== generation) return;
    if (result?.isError || !setSnapshot(toolPayload(result))) {
      throw new Error(result?.content?.[0]?.text || "Invalid monitor response");
    }
    showNotice("");
  } catch (error) {
    if (!disposed && requestGeneration === generation) showNotice(`Refresh failed. ${error.message}`);
  } finally {
    refreshInFlight = false;
    refreshButton.disabled = disposed;
    if (refreshQueued && !disposed) {
      refreshQueued = false;
      refresh();
    } else {
      schedule();
    }
  }
}

function node(tag, className, text) {
  const element = document.createElement(tag);
  if (className) element.className = className;
  if (text !== undefined) element.textContent = text;
  return element;
}

function badge(text, flavor = "") {
  return node("span", `badge ${flavor}`, text);
}

function sourceLabel(source) {
  return ({runtime_rollout: "runtime", config_toml: "config", request_override: "override",
    requested: "override", user_config: "config", project_config: "config",
    previous_round: "previous round"})[source] || source || "unknown";
}

function modelStrip(task) {
  const row = node("div", "model");
  const model = task.effective_model ?? task.model;
  const effort = task.effective_reasoning_effort ?? task.reasoning_effort;
  const sources = [...new Set([sourceLabel(task.model_source), sourceLabel(task.reasoning_effort_source)])];
  row.append(badge(model || "Unknown model", "model-value"), badge(effort || "Unknown effort", "model-value"),
    badge(sources.join(" / ")));
  const defaults = [];
  if (model && task.config_model && model !== task.config_model) defaults.push(task.config_model);
  if (effort && task.config_reasoning_effort && effort !== task.config_reasoning_effort) {
    defaults.push(task.config_reasoning_effort);
  }
  if (defaults.length) row.append(badge(`≠ config: ${defaults.join(" · ")}`, "override"));
  return row;
}

function feed(task) {
  const activities = task.recent_activities ?? [];
  if (!activities.length) return null;
  const details = node("details", "feed");
  details.open = feedState.get(task.task_id) ?? live(task);
  details.dataset.feedTask = task.task_id;
  details.addEventListener("toggle", () => {
    if (details.isConnected) feedState.set(task.task_id, details.open);
  });
  details.append(node("summary", "", "Recent activity · UTC"));
  const list = node("ol");
  for (const entry of activities.slice(-8).reverse()) {
    const item = node("li");
    const date = new Date(entry.ts);
    const stamp = node("time", "", entry.ts && Number.isFinite(date.getTime()) ? date.toISOString().slice(11, 19) : "–");
    if (stamp.textContent !== "–") stamp.dateTime = date.toISOString();
    item.append(stamp, node("span", "", entry.text || ""));
    list.append(item);
  }
  details.append(list);
  return details;
}

const feedbackVerdicts = ["accepted", "partial", "rework", "rejected", "abandoned"];
const tokenParts = [["input_tokens", "input"], ["cached_input_tokens", "cached"],
  ["output_tokens", "output"], ["reasoning_output_tokens", "reasoning"]];
const number = (value, digits = 0) => value == null ? "—" :
  value.toLocaleString(undefined, {maximumFractionDigits: digits});
const percent = value => value == null ? "—" : `${number(value * 100, 1)}%`;
const duration = value => value == null ? "—" : `${number(value, 2)}s`;

function totalTokens(usage) {
  return usage.total_tokens ?? (usage.input_tokens ?? 0) + (usage.output_tokens ?? 0);
}

function usageBadge(task) {
  const prior = task.total_usage;
  const current = live(task) || !prior ? task.round_usage ?? task.usage : null;
  if (!prior && !current) return null;
  const total = (prior ? totalTokens(prior) : 0) + (current ? totalTokens(current) : 0);
  const usage = node("span", "", `${number(total)} tokens`);
  usage.title = tokenParts.map(([key, label]) =>
    `${number((prior?.[key] ?? 0) + (current?.[key] ?? 0))} ${label}`).join(" · ");
  usage.setAttribute("aria-label", `${number(total)} tokens · ${usage.title}`);
  return usage;
}

function feedbackForm(task) {
  const id = task.task_id;
  const feedback = task.feedback ?? {};
  const draft = feedbackDrafts.get(id) ?? feedback;
  const form = node("form", "feedback-form");
  form.setAttribute("aria-label", `Feedback for ${id}`);
  const ratingRow = node("div", "feedback-row");
  const stars = node("div", "feedback-stars");
  stars.setAttribute("role", "group");
  stars.setAttribute("aria-label", "Rating");
  const verdict = node("select");
  verdict.setAttribute("aria-label", "Verdict");
  verdict.add(new Option("Verdict", ""));
  for (const value of feedbackVerdicts) verdict.add(new Option(value[0].toUpperCase() + value.slice(1), value));
  verdict.value = draft.verdict ?? "";
  ratingRow.append(stars, verdict);

  const noteRow = node("div", "feedback-row");
  const notes = node("input");
  notes.type = "text";
  notes.placeholder = "Quick feedback note…";
  notes.setAttribute("aria-label", "Feedback note");
  notes.value = draft.notes ?? "";
  const save = node("button", "", "Save");
  save.type = "submit";
  noteRow.append(notes, save);
  const status = node("p", "feedback-status");
  status.setAttribute("role", "status");
  let rating = draft.rating;

  function updateForm() {
    const busy = savingFeedback.has(id);
    for (const star of stars.children) {
      const value = Number(star.dataset.rating);
      star.textContent = value <= rating ? "★" : "☆";
      star.setAttribute("aria-pressed", String(value === rating));
      star.setAttribute("aria-disabled", String(busy));
    }
    save.setAttribute("aria-disabled", String(busy));
    const message = feedbackMessages.get(id);
    status.textContent = message?.text ?? "";
    status.hidden = !message;
    status.dataset.error = String(message?.error ?? false);
  }

  function storeDraft() {
    const values = {rating, verdict: verdict.value, notes: notes.value};
    feedbackDrafts.set(id, values);
    return values;
  }

  async function submit(nextRating = rating) {
    if (savingFeedback.has(id)) return;
    rating = nextRating;
    const sent = storeDraft();
    const args = {task_id: id, notes: sent.notes};
    if (sent.rating != null) args.rating = sent.rating;
    if (sent.verdict) args.verdict = sent.verdict;
    savingFeedback.add(id);
    feedbackMessages.set(id, {text: "Saving…"});
    updateForm();
    try {
      const {task_id, ...changes} = args;
      let saved = {...feedback, ...changes};
      if (!preview) {
        const result = await call("codex_feedback", args);
        const payload = toolPayload(result);
        if (result?.isError || !payload?.feedback) {
          throw new Error(payload?.error || "Could not save feedback");
        }
        saved = payload.feedback;
      }
      tasks = tasks.map(item => item.task_id === id ? {...item, feedback: saved} : item);
      if (feedbackDrafts.get(id) === sent) {
        feedbackDrafts.delete(id);
        rating = saved.rating;
        verdict.value = saved.verdict ?? "";
        notes.value = saved.notes ?? "";
      }
      const message = {text: "Feedback saved."};
      feedbackMessages.set(id, message);
      setTimeout(() => {
        if (feedbackMessages.get(id) === message) {
          feedbackMessages.delete(id);
          updateForm();
          if (!form.isConnected) render(undefined, true);
        }
      }, 3000);
      if (preview) {
        analytics = demoAnalytics(tasks);
        if (view === "analytics") renderAnalytics();
      } else {
        generation++;
        refresh();
      }
    } catch (error) {
      feedbackMessages.set(id, {text: `Save failed. ${error.message}`, error: true});
    } finally {
      savingFeedback.delete(id);
      updateForm();
      if (!form.isConnected) render(undefined, true);
    }
  }

  for (let value = 1; value <= 5; value++) {
    const star = node("button");
    star.type = "button";
    star.dataset.rating = value;
    star.setAttribute("aria-label", `${value} of 5 stars`);
    star.addEventListener("click", () => submit(value));
    stars.append(star);
  }
  notes.addEventListener("input", storeDraft);
  verdict.addEventListener("change", storeDraft);
  form.addEventListener("submit", event => {
    event.preventDefault();
    submit();
  });
  form.append(ratingRow, noteRow, status);
  const first = (feedback.user_first_prompts ?? []).slice().sort((a, b) =>
    (b.recorded_at ?? "").localeCompare(a.recorded_at ?? "") || b.round - a.round)[0];
  if (first?.prompt) {
    const text = first.prompt.replace(/\s+/g, " ").trim();
    const reply = node("p", "first-reply", `First reply · “${text.length > 150 ? text.slice(0, 149) + "…" : text}”`);
    reply.title = first.prompt;
    form.append(reply);
  }
  updateForm();
  return form;
}

async function cancel(task) {
  if (!sameRound(task, confirmTask)) {
    confirmTask = task;
    render(task.task_id);
    return;
  }
  confirmTask = null;
  cancelling = task.task_id;
  render();
  let errorMessage = "";
  try {
    let cancelled = preview;
    if (!preview) {
      const result = await call("codex_cancel", {task_id: task.task_id});
      const payload = toolPayload(result);
      if (result?.isError || payload?.cancelled === false) {
        throw new Error(payload?.message || result?.content?.[0]?.text || "Cancellation failed");
      }
      cancelled = payload?.cancelled === true;
    }
    if (cancelled) {
      tasks = tasks.map(item => {
        if (!sameRound(item, task) || !live(item)) return item;
        count = Math.max(0, count - 1);
        return {
          ...item, status: "cancelled", alive: false,
          elapsed: item.elapsed + (performance.now() - item.receivedAt) / 1000,
          current_activity: "Task cancelled",
        };
      });
      if (preview) analytics = demoAnalytics(tasks);
    }
  } catch (error) {
    errorMessage = `Cancel failed. ${error.message}`;
  } finally {
    if (disposed) return;
    cancelling = null;
    render();
    generation++;
    if (!preview) await refresh();
    if (errorMessage && !disposed) showNotice(errorMessage);
  }
}

function taskCard(task) {
  const running = live(task);
  const card = node("article", running ? "task is-live" : "task");
  const head = node("div", "task-head");
  const dot = node("span", "dot");
  dot.setAttribute("aria-hidden", "true");
  const clock = node("span", "clock");
  clock.setAttribute("aria-label", "Total elapsed time");
  clock.title = "Total elapsed time across rounds";
  clocks.push({element: clock, task});
  head.append(dot, node("h3", "", task.task_id), node("span", "round", `r${task.round ?? 1}`), clock);
  const model = modelStrip(task);
  const reworks = task.rework_count ?? 0;
  if (reworks > 0) model.append(badge(`${reworks} rework${reworks === 1 ? "" : "s"}`, "override"));
  card.append(head, model);
  if (task.task_summary) card.append(node("p", "task-summary", task.task_summary));

  const details = node("div", "details");
  const location = task.worktree_branch || task.workdir?.split(/[/\\]/).filter(Boolean).pop();
  if (location) {
    const path = node("span", "", location);
    path.title = task.workdir || location;
    details.append(path);
  }
  const usage = usageBadge(task);
  if (usage) details.append(usage);
  if (details.childElementCount) card.append(details);
  const activity = task.current_activity || task.last_event;
  if (activity || running) {
    const block = node("div", "activity");
    block.append(node("strong", "", running ? "Current activity" : "Final activity"),
      node("span", "", activity || "Waiting for activity"));
    card.append(block);
  }
  const recent = feed(task);
  if (recent) card.append(recent);

  const footer = node("div", "task-footer");
  footer.append(node("span", "state-label", task.status || "Unknown"));
  if (running) {
    const armed = sameRound(task, confirmTask);
    const button = node("button", "cancel", cancelling === task.task_id ? "Cancelling…" : armed ? "Confirm?" : "Cancel");
    button.type = "button";
    button.disabled = cancelling !== null;
    button.dataset.cancelTask = task.task_id;
    button.setAttribute("aria-pressed", String(armed));
    button.setAttribute("aria-label", `${armed ? "Confirm cancellation of" : "Cancel"} ${task.task_id}`);
    button.addEventListener("click", () => cancel(task));
    card.addEventListener("keydown", event => {
      if (event.key === "Escape" && sameRound(task, confirmTask)) {
        confirmTask = null;
        render(task.task_id);
      }
    });
    footer.append(button);
  }
  card.append(footer);
  if (!running) card.append(feedbackForm(task));
  return card;
}

function tick() {
  const now = performance.now();
  for (const {element, task} of clocks) {
    const elapsed = live(task) ? (task.total_duration_seconds ?? 0) + task.elapsed + (now - task.receivedAt) / 1000 :
      task.total_duration_seconds ?? task.elapsed;
    const seconds = Number.isFinite(elapsed) ? Math.floor(elapsed) : 0;
    const hours = Math.floor(seconds / 3600);
    const digits = [Math.floor(seconds / 60) % 60, seconds % 60];
    if (hours) digits.unshift(hours);
    const text = digits.map(value => String(value).padStart(2, "0")).join(":");
    if (element.textContent !== text) element.textContent = text;
  }
}

function renderAnalytics() {
  const previousScroll = analyticsView.querySelector(".table-scroll");
  const scrollPosition = previousScroll?.scrollLeft ?? 0;
  const restoreFocus = previousScroll && document.activeElement === previousScroll;
  const overall = analytics?.overall;
  if (!overall) {
    analyticsView.replaceChildren(node("p", "empty", receivedResult ? "No analytics available." : "Connecting to Codex Castor…"));
    return;
  }
  const kpis = node("dl", "kpis");
  for (const [label, value] of [
    ["Total tasks", number(overall.task_count)], ["Completion rate", percent(overall.completion_rate)],
    ["First-pass rate", percent(overall.first_pass_rate)], ["Avg duration", duration(overall.avg_duration_seconds)],
    ["Total tokens", number(overall.total_tokens)], ["Avg rating", number(overall.avg_rating, 2)],
  ]) {
    const metric = node("div");
    metric.append(node("dt", "", label), node("dd", "", value));
    kpis.append(metric);
  }
  const section = node("section", "section");
  const heading = node("h2", "", "Model × Reasoning Effort");
  heading.id = "matrix-heading";
  section.append(heading);
  const rows = analytics.by_model_effort ?? [];
  if (rows.length) {
    const table = node("table", "analytics-table");
    table.setAttribute("aria-labelledby", heading.id);
    const header = table.createTHead().insertRow();
    for (const name of ["Model", "Effort", "Tasks", "Avg Time", "Avg Tokens", "Rework Rate", "Avg Rating"]) {
      const cell = node("th", "", name);
      cell.scope = "col";
      header.append(cell);
    }
    const body = table.createTBody();
    for (const row of rows) {
      const line = body.insertRow();
      for (const value of [row.model, row.reasoning_effort, number(row.task_count),
        duration(row.avg_duration_seconds), number(row.avg_total_tokens), percent(row.rework_rate),
        number(row.avg_rating, 2)]) {
        line.append(node("td", "", value));
      }
    }
    const scroll = node("div", "table-scroll");
    scroll.tabIndex = 0;
    scroll.setAttribute("role", "region");
    scroll.setAttribute("aria-labelledby", heading.id);
    scroll.append(table);
    section.append(scroll);
  } else {
    section.append(node("p", "empty", "No task telemetry yet."));
  }
  const hint = node("p", "export-hint", "Local exports · ");
  for (const [index, file] of ["telemetry.jsonl", "report.md", "telemetry.csv"].entries()) {
    if (index) hint.append(" · ");
    hint.append(node("code", "", `${telemetryDir.replace(/\/$/, "")}/${file}`));
  }
  analyticsView.replaceChildren(kpis, section, hint);
  const scroll = analyticsView.querySelector(".table-scroll");
  if (scroll) {
    scroll.scrollLeft = scrollPosition;
    if (restoreFocus) scroll.focus({preventScroll: true});
  }
}

function render(focusTask = document.activeElement?.dataset.cancelTask, background = false) {
  byId("active").textContent = `${count} active`;
  byId("total").textContent = `${total} total`;
  const showTasks = view === "tasks";
  tasksView.hidden = !showTasks;
  analyticsView.hidden = showTasks;
  byId("filter").hidden = !showTasks;
  byId("show-tasks").setAttribute("aria-pressed", String(showTasks));
  byId("show-analytics").setAttribute("aria-pressed", String(!showTasks));
  if (!showTasks) {
    clocks.length = 0;
    renderAnalytics();
    return;
  }
  if (background && document.activeElement?.closest(".feedback-form")) {
    taskRenderPending = true;
    return;
  }
  taskRenderPending = false;
  const focusFeed = document.activeElement?.parentElement?.dataset.feedTask;
  for (const details of tasksView.querySelectorAll("details")) {
    feedState.set(details.dataset.feedTask, details.open);
  }
  clocks.length = 0;
  const visible = tasks.filter(task => !selected || task.task_id === selected);
  const groups = [["Active tasks", visible.filter(live)]];
  if (!activeOnly) groups.push(["Recent tasks", visible.filter(task => !live(task))]);
  const sections = [];
  for (const [heading, members] of groups) {
    if (!members.length) continue;
    const section = node("section", "section");
    const grid = node("div", "grid");
    for (const task of members) grid.append(taskCard(task));
    section.append(node("h2", "", heading), grid);
    sections.push(section);
  }
  if (!sections.length) {
    const message = !receivedResult ? "Connecting to Codex Castor…" :
      selected ? `No matching tasks for ${selected}.` : activeOnly ? "No active tasks." : "No Codex tasks yet.";
    sections.push(node("p", "empty", message));
  }
  tasksView.replaceChildren(...sections);
  if (focusTask) {
    [...tasksView.querySelectorAll("[data-cancel-task]")]
      .find(button => button.dataset.cancelTask === focusTask)?.focus({preventScroll: true});
  } else if (focusFeed) {
    [...tasksView.querySelectorAll("details")]
      .find(details => details.dataset.feedTask === focusFeed)?.querySelector("summary")?.focus({preventScroll: true});
  }
  tick();
}

function stop() {
  disposed = true;
  clearTimeout(pollTimer);
  clearInterval(tickTimer);
  resizeObserver?.disconnect();
  for (const request of pending.values()) {
    clearTimeout(request.timeout);
    request.reject(new Error("Monitor closed"));
  }
  pending.clear();
}

window.addEventListener("message", event => {
  const msg = event.data;
  if (preview || disposed || event.source !== parentWindow || msg?.jsonrpc !== "2.0") return;
  if (parentOrigin !== "*" && event.origin !== parentOrigin) return;
  if (msg.method === "ping" || msg.method === "ui/resource-teardown") {
    if (msg.id !== undefined) post({id: msg.id, result: {}});
    if (msg.method === "ui/resource-teardown") stop();
  } else if (msg.method === "ui/notifications/host-context-changed") {
    hostContext(msg.params);
  } else if (msg.method === "ui/notifications/tool-input") {
    const candidate = msg.params?.arguments?.task_id;
    const next = typeof candidate === "string" ? candidate : "";
    if (next !== selected) {
      selected = next;
      generation++;
      render();
      if (ready && !paused) refresh();
    }
  } else if (msg.method === "ui/notifications/tool-result") {
    if (msg.params?.isError || !setSnapshot(toolPayload(msg.params))) {
      showNotice(msg.params?.content?.[0]?.text || "Could not load the monitor result.");
    } else {
      showNotice("");
      schedule();
    }
  } else if (msg.method === "ui/notifications/tool-cancelled") {
    showNotice(msg.params?.reason || "The host cancelled the initial monitor request.");
  } else if (!msg.method && msg.id === 1 && !ready) {
    if (msg.error) { showNotice(msg.error.message || "Monitor initialization failed."); return; }
    if (event.origin && event.origin !== "null") parentOrigin = event.origin;
    hostContext(msg.result?.hostContext);
    ready = true;
    post({method: "ui/notifications/initialized", params: {}});
    if (typeof ResizeObserver === "function") {
      resizeObserver = new ResizeObserver(() => {
        post({method: "ui/notifications/size-changed", params: {
          width: document.documentElement.clientWidth, height: Math.ceil(document.body.getBoundingClientRect().height),
        }});
      });
      resizeObserver.observe(document.body);
    }
    if (receivedResult) schedule();
    else refresh();
  } else if (!msg.method && pending.has(msg.id)) {
    const request = pending.get(msg.id);
    pending.delete(msg.id);
    clearTimeout(request.timeout);
    if (msg.error) request.reject(new Error(msg.error.message || "Tool call failed"));
    else request.resolve(msg.result);
  }
});

for (const name of ["tasks", "analytics"]) {
  byId(`show-${name}`).addEventListener("click", () => {
    view = name;
    render();
  });
}
tasksView.addEventListener("focusout", () => {
  requestAnimationFrame(() => {
    if (taskRenderPending && view === "tasks") render(undefined, true);
  });
});
byId("filter").addEventListener("click", event => {
  activeOnly = !activeOnly;
  event.currentTarget.textContent = activeOnly ? "Show all" : "Active only";
  event.currentTarget.setAttribute("aria-pressed", String(activeOnly));
  render();
});
byId("pause").addEventListener("click", event => {
  paused = !paused;
  event.currentTarget.textContent = paused ? "Resume" : "Pause";
  event.currentTarget.setAttribute("aria-pressed", String(paused));
  if (paused) clearTimeout(pollTimer);
  else refresh();
});
refreshButton.addEventListener("click", refresh);
tickTimer = setInterval(tick, 1000);

function demoAnalytics(sample) {
  const settled = sample.filter(task => !live(task));
  const mean = values => values.length ? values.reduce((sum, value) => sum + value, 0) / values.length : null;
  const rates = (numerator, denominator) => denominator ? numerator / denominator : 0;
  const groupStats = tasks => ({
    task_count: tasks.length,
    avg_duration_seconds: mean(tasks.map(task => task.total_duration_seconds ?? task.elapsed_seconds)),
    avg_total_tokens: mean(tasks.map(task => task.total_usage ?? task.usage).filter(Boolean).map(totalTokens)),
    rework_rate: rates(tasks.filter(task => task.rework_count > 0).length, tasks.length),
    avg_rating: mean(tasks.map(task => task.feedback?.rating).filter(value => value != null)),
  });
  const completed = settled.filter(task => task.status === "completed");
  const groups = new Map();
  for (const task of settled) {
    const key = JSON.stringify([task.effective_model, task.effective_reasoning_effort]);
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(task);
  }
  return {
    overall: {
      ...groupStats(settled),
      completion_rate: rates(completed.length, settled.length),
      first_pass_rate: rates(completed.filter(task => !task.rework_count).length, completed.length),
      total_tokens: settled.reduce((sum, task) => sum + totalTokens(task.total_usage ?? task.usage ?? {}), 0),
    },
    by_model_effort: Array.from(groups.values(), group => ({
      model: group[0].effective_model, reasoning_effort: group[0].effective_reasoning_effort, ...groupStats(group),
    })),
  };
}

if (preview) {
  byId("preview").hidden = false;
  if (window.matchMedia("(prefers-color-scheme: dark)").matches) hostContext({theme: "dark"});
  const ago = seconds => new Date(Date.now() - seconds * 1000).toISOString();
  const sample = [{
      task_id: "castor-observability", status: "running", alive: true, round: 1,
      task_summary: "Show dispatched task activity in Codex Monitor.",

      config_model: "gpt-6.2-sol", config_reasoning_effort: "xhigh",

      worktree_branch: "codex/castor-observability", elapsed_seconds: 102,

        {ts: ago(16), text: "✎ Updated scripts/watch.py and mcp/monitor.html"},
        {ts: ago(4), text: "▶ python3 -m unittest discover -s tests -v"},
      ],
    }, {
      task_id: "installer-validation", status: "completed", alive: false, round: 2,

      effective_model: "gpt-6.2-sol", effective_reasoning_effort: "xhigh",

      worktree_branch: "codex/installer-validation", elapsed_seconds: 84,
      current_activity: "✓ Installer checks passed", rework_count: 1, total_duration_seconds: 139,
      total_usage: {input_tokens: 86000, cached_input_tokens: 37000, output_tokens: 1700, reasoning_output_tokens: 450},

        user_first_prompts: [{round: 2, prompt: "The upgrade works on my machine too.", recorded_at: ago(100)}]},

      model_source: "runtime_rollout", reasoning_effort_source: "runtime_rollout",

      feedback: {},
    }];
  setSnapshot({server_time: ago(0), tasks: sample, analytics: demoAnalytics(sample)});
} else {
  render();
  post({id: 1, method: "ui/initialize", params: {
    appInfo: {name: "codex-castor-monitor", version: "1.1.0"},
    appCapabilities: {availableDisplayModes: ["inline"]},
    protocolVersion: protocol,
  }});
}

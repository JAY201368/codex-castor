<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Codex Castor Monitor</title>
<style>
:root {
  color-scheme: light;
  --fb-bg: #f8f9fb; --fb-surface: #fff; --fb-subtle: #f2f4f7;
  --fb-text: #182336; --fb-text-2: #475569; --fb-text-3: #606d7f;
  --fb-border: #d5dbe3; --fb-border-2: #e4e8ee;
  --fb-accent: #2563eb; --fb-success: #15803d; --fb-warning: #b45309; --fb-danger: #dc2626;
  --bg: var(--color-background-primary, var(--fb-bg));
  --surface: var(--color-background-secondary, var(--fb-surface));
  --subtle: var(--color-background-tertiary, var(--fb-subtle));
  --text: var(--color-text-primary, var(--fb-text));
  --secondary: var(--color-text-secondary, var(--fb-text-2));
  --muted: var(--color-text-tertiary, var(--fb-text-3));
  --border: var(--color-border-primary, var(--fb-border));
  --line: var(--color-border-secondary, var(--fb-border-2));
  --accent: var(--color-text-info, var(--fb-accent));
  --success: var(--color-text-success, var(--fb-success));
  --warning: var(--color-text-warning, var(--fb-warning));
  --danger: var(--color-text-danger, var(--fb-danger));
  --danger-ink: #ffffff;
  --quota-green: #1e9e4a;
  --quota-blue: #2f7cf6;
  --quota-yellow: #d99100;
  --quota-red: #dc362e;
  --ring: var(--color-ring-primary, var(--accent));
  --wash: color-mix(in srgb, var(--accent) 10%, transparent);
  --good: color-mix(in srgb, var(--success) 10%, transparent);
  --bad: color-mix(in srgb, var(--danger) 8%, transparent);
  --warm: color-mix(in srgb, var(--warning) 10%, transparent);
  --dots: radial-gradient(circle, color-mix(in srgb, var(--text) 4%, transparent) 1px, transparent 1px);
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  font-family: var(--font-sans, -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif);
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --fb-bg: #12161d; --fb-surface: #1b2029; --fb-subtle: #242b36;
  --fb-text: #ecf0f5; --fb-text-2: #bdc7d4; --fb-text-3: #9ca9ba;
  --fb-border: #394351; --fb-border-2: #303946;
  --fb-accent: #60a5fa; --fb-success: #4ade80; --fb-warning: #fbbf24; --fb-danger: #f87171;
  --danger-ink: #12161d;
  --quota-green: #4ade80;
  --quota-blue: #60a5fa;
  --quota-yellow: #facc15;
  --quota-red: #f87171;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--text); font-size: 13px; line-height: 1.5; }
main { max-width: 1560px; margin: auto; padding: 0 clamp(12px, 2.8vw, 40px) 32px; }
h1, h2, h3, p, dl, dd, pre, blockquote { margin: 0; }
h1 { font-size: 1.05rem; font-weight: 650; letter-spacing: -.035em; }
h2 { font-size: 16px; letter-spacing: -.025em; font-weight: 650; }
h3 { font-size: 13.5px; font-weight: 600; line-height: 1.38; }
button, input, select { font: inherit; color: var(--text); }
button, select, input { border: 1px solid var(--border); border-radius: 6px; background: var(--surface); }
button { cursor: pointer; min-height: 28px; padding: 2px 9px; font-size: 12px; font-weight: 550; }
button:hover, select:hover { border-color: var(--muted); }
button:disabled { cursor: wait; opacity: .65; }
:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
input { padding: 3px 8px; caret-color: var(--accent); }
input::placeholder { color: var(--muted); }
::selection { background: var(--wash); color: var(--text); }
svg { flex: none; vertical-align: middle; }
.mono, code, pre, time, .metric-value, td.numeric { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.masthead, .toolbar, .section-head, .row, .brand, .group, .status, .activity, .stars,
.detail-bar, .title-row, .feedback-row, .chips, .stream-heading, .icon-button { display: flex; align-items: center; gap: 8px; }
.masthead, .toolbar, .section-head { justify-content: space-between; }
.masthead { min-height: 58px; padding-block: 6px; flex-wrap: wrap; align-content: center; row-gap: 6px;
  border-bottom: 1px solid var(--line); background-image: var(--dots); background-size: 8px 8px; }
.brand { gap: 9px; } .mark { color: var(--accent); }
.pill, .status { display: inline-flex; align-items: center; gap: 5px; padding: 2px 7px; border-radius: 5px;
  white-space: nowrap; flex: none;
  background: var(--subtle); color: var(--secondary); font-size: 11px; font-weight: 550; line-height: 1.5; }
.quota-chip { display: inline-flex; align-items: center; flex-wrap: wrap; row-gap: 4px; max-width: 100%; margin-inline-start: auto;
  padding: 3px 9px; border-radius: 20px; font-size: 11px; line-height: 1.2; }
.quota-window { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap;
  color: var(--quota-color); transition: color 240ms ease; }
.quota-window + .quota-window { border-inline-start: 1px solid var(--border); margin-inline-start: 7px; padding-inline-start: 7px; }
.quota-window.green { --quota-color: var(--quota-green); }
.quota-window.blue { --quota-color: var(--quota-blue); }
.quota-window.yellow { --quota-color: var(--quota-yellow); }
.quota-window.red { --quota-color: var(--quota-red); }
.quota-label { color: var(--secondary); }
.quota-meter { width: 24px; height: 4px; border-radius: 4px; overflow: hidden; background: var(--line); }
.quota-fill { display: block; height: 100%; border-radius: inherit; background-color: var(--quota-color);
  transition: width 240ms ease, background-color 240ms ease; }
.running, .starting, .info { color: var(--accent); background-color: var(--wash); }
.completed, .saved { color: var(--success); background-color: var(--good); }
.failed, .error { color: var(--danger); background-color: var(--bad); }
.dot { display: inline-block; width: 7px; height: 7px; border-radius: 100%; background: var(--muted); flex: none; }
.dot.running, .dot.starting { background: var(--accent); animation: pulse 2s ease-in-out infinite; }
.dot.completed { background: var(--success); } .dot.failed { background: var(--danger); }
@keyframes pulse { 50% { opacity: .55; } }
.toolbar { margin: 18px 0 22px; gap: 8px; flex-wrap: wrap; }
.group { gap: 2px; background: var(--subtle); padding: 3px; border-radius: 8px; width: fit-content; }
.group button { border: 1px solid transparent; background: transparent; color: var(--secondary); }
.group button[aria-pressed="true"] { background: var(--surface); border-color: var(--border); color: var(--text); box-shadow: 0 1px 3px #0001; }
.primary button { min-height: 32px; font-size: 13px; padding-inline: 14px; }
.small-group { padding: 2px; } .small-group button { font-size: 11.5px; min-height: 22px; padding: 1px 7px; }
#filters { background: transparent; padding: 0; gap: 0; margin-inline-start: auto; max-width: 100%; flex-wrap: wrap; }
#filters button { display: inline-flex; align-items: center; gap: 5px; background: var(--subtle);
  min-height: 26px; padding: 6px 9px; line-height: 12px; border-radius: 0; white-space: nowrap;
  font-variant-numeric: tabular-nums; }
#filters button:first-child { border-radius: 6px 0 0 6px; }
#filters button:last-child { border-radius: 0 6px 6px 0; }
#filters button[aria-pressed="true"] { background: var(--surface); }
.section { margin-top: 22px; }
.section-head { min-height: 25px; margin-bottom: 10px; gap: 10px; flex-wrap: wrap; }
.section-head .row { gap: 7px; }
.card-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; }
.task-card, .panel, .kpis > div, .empty { background: var(--surface); border: 1px solid var(--border); border-radius: 11px; }
.task-card { min-width: 0; height: 302px; padding: 14px 15px; display: grid;
  grid-template-rows: 38px 22px 22px 38px 34px minmax(0, 1fr); gap: 8px; cursor: pointer;
  transition: border-color .16s, box-shadow .16s; }
.task-card:hover { border-color: color-mix(in srgb, var(--accent) 55%, var(--border)); box-shadow: 0 4px 12px #0000000d; }
.title-row { align-items: start; min-width: 0; gap: 7px; }
.title-row .dot { margin-top: 6px; }
.title-row h3, .preview-text { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; overflow-wrap: anywhere; }
.title-row h3 { flex: 1; }
.card-meta, .card-meta > span { display: flex; align-items: center; gap: 5px; min-width: 0; }
.card-meta { gap: 10px; white-space: nowrap; color: var(--secondary); font-size: 11px; font-variant-numeric: tabular-nums; }
.card-meta .project-meta { flex: 1; }
.card-model { display: flex; align-items: center; gap: 5px; min-width: 0; }
.card-model .model-pill { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.project-meta span, .project-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.project-group + .project-group { margin-top: 8px; }
.project-toggle { width: 100%; display: flex; align-items: center; gap: 8px; padding: 11px 12px;
  text-align: left; border-radius: 8px; font-size: 13px; }
.project-name { font-weight: 600; }
.project-info { margin-left: auto; color: var(--muted); white-space: nowrap; font-size: 11px; font-variant-numeric: tabular-nums; }
.project-toggle svg { color: var(--secondary); }
.project-chevron { transition: transform 160ms ease-out; }
.project-toggle[aria-expanded="true"] .project-chevron { transform: rotate(90deg); }
.project-group .card-grid { margin: 10px 0 16px; }
.chevron { color: var(--muted); transition: transform .16s; }
.task-card:hover .chevron { transform: translateX(2px); color: var(--accent); }
.preview-text { align-self: start; font-size: 12.5px; line-height: 1.48; color: var(--secondary); }
.activity { min-width: 0; background: var(--subtle); border: 1px solid var(--line); border-radius: 7px; padding: 0 9px; color: var(--secondary); gap: 7px; }
.activity-text { font-size: 12px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.activity .pill { font-size: 10px; padding: 1px 5px; }
.feedback-form { display: grid; align-content: start; gap: 7px; }
.task-card .feedback-form { padding-top: 10px; border-top: 1px solid var(--line); cursor: default; }
.feedback-row { gap: 5px; min-width: 0; }
.stars { gap: 0; } .star { width: 24px; min-height: 24px; height: 24px; padding: 0; background: transparent; border: 0; color: var(--muted); }
.star:hover, .star.filled { color: var(--warning); }
.feedback-row select { height: 26px; min-height: 26px; font-size: 11.5px; min-width: 0; width: 92px; margin-left: auto; }
.feedback-row input { flex: 1; min-width: 0; height: 28px; font-size: 12px; }
.save { min-width: 61px; height: 28px; display: inline-flex; align-items: center; justify-content: center; gap: 4px; }
.save.error { border-color: var(--danger); color: var(--danger); }
.cancel { height: 26px; min-height: 26px; font-size: 11.5px; color: var(--danger);
  border-color: color-mix(in srgb, var(--danger) 48%, var(--border)); background: var(--surface);
  transition: background-color 140ms ease, color 140ms ease, border-color 140ms ease; }
.cancel:hover:not(:disabled):not(.confirm) { border-color: var(--danger); background: var(--bad);
  color: color-mix(in srgb, var(--danger) 88%, var(--text)); }
.cancel.confirm { background: var(--danger); border-color: var(--danger); color: var(--danger-ink); }
.cancel.confirm:hover:not(:disabled) {
  background: color-mix(in srgb, var(--danger) 88%, var(--text));
  border-color: color-mix(in srgb, var(--danger) 88%, var(--text)); }
.card-model .cancel { margin-left: auto; flex: none; height: 22px; min-height: 22px; padding: 0 8px;
  font-size: 11px; line-height: 1; display: inline-flex; align-items: center; justify-content: center; }
.empty { padding: 28px; color: var(--secondary); background-image: var(--dots); background-size: 8px 8px; }
.notice { padding: 8px 12px; color: var(--danger); background: var(--bad); border-radius: 6px; }
body.overlay-open { overflow: hidden; min-height: 100dvh; }
.sheet-backdrop { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
  background: color-mix(in srgb, var(--bg) 42%, rgba(15,23,42,.16));
  -webkit-backdrop-filter: blur(10px) saturate(1.15); backdrop-filter: blur(10px) saturate(1.15); }
.level-2 { z-index: 40; padding: clamp(12px, 2.2vw, 24px); }
.level-3 { z-index: 60; padding: clamp(20px, 3.2vw, 38px); }
.sheet-panel { width: 100%; height: 100%; max-width: 1460px; display: flex; flex-direction: column;
  overflow: hidden; background: var(--bg); border: 1px solid var(--border); border-radius: 14px;
  box-shadow: 0 18px 48px rgba(15,23,42,.18); animation: sheet-in 160ms ease-out; }
.level-3 .sheet-panel { max-width: 1432px; }
:root[data-theme="dark"] .sheet-backdrop { background: rgba(6,9,15,.56);
  -webkit-backdrop-filter: blur(12px) saturate(1.1); backdrop-filter: blur(12px) saturate(1.1); }
:root[data-theme="dark"] .sheet-panel { box-shadow: 0 22px 56px rgba(0,0,0,.55); }
@keyframes sheet-in { from { opacity: .3; transform: translateY(5px); } }
.sheet-header { flex: none; padding: 12px clamp(10px, 2vw, 24px); background: var(--surface); border-bottom: 1px solid var(--line); }
.sheet-body { flex: 1; min-height: 0; overflow: auto; overscroll-behavior: contain; padding: 0 clamp(10px, 2vw, 24px) 16px; }
.level-3 .sheet-body { padding-top: 16px; }
.detail-bar { align-items: start; flex-wrap: wrap; }
.reading-controls { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.detail-name { flex: 1; min-width: 120px; overflow-wrap: anywhere; }
.detail-name h2 { font-size: 18px; } .detail-name .row { flex-wrap: wrap; }
.secondary { color: var(--secondary); } .muted { color: var(--muted); font-size: 12px; }
.panel { padding: 16px; margin-top: 12px; min-width: 0; }
.config { display: grid; grid-template-columns: auto minmax(0,1fr); font-size: 12px; }
.config dt, .config dd { border-top: 1px solid var(--line); padding: 8px; overflow-wrap: anywhere; }
.config dt { color: var(--secondary); padding-left: 0; }
.chips { flex-wrap: wrap; gap: 5px; min-width: 0; } .chips > * { overflow-wrap: anywhere; }
.chips > .pill { max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.metrics, .kpis { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 8px; }
.metric, .kpis > div { padding: 11px; min-width: 0; background: var(--subtle); border-radius: 7px; }
.metric dt, .kpis dt, .breakdown dt { color: var(--secondary); font-size: 11.5px; }
.metric-value, .kpis dd { display: block; font-size: 17px; letter-spacing: -.035em; margin: 3px 0; }
.breakdown { display: flex; flex-wrap: wrap; gap: 10px 24px; margin-top: 12px; }
.breakdown dd { font-family: var(--mono); }
.banner { margin-top: 12px; padding: 8px; background: var(--wash); border-radius: 6px; overflow-wrap: anywhere; }
.table-scroll { overflow-x: auto; margin-top: 12px; }
table { border-collapse: collapse; text-align: left; width: 100%; font-variant-numeric: tabular-nums; font-size: 12px; }
th, td { padding: 8px; border-bottom: 1px solid var(--line); white-space: nowrap; } th { color: var(--secondary); font-weight: 550; }
.prompt-surface { height: 280px; overflow: auto; padding: 14px; background: var(--subtle); border-radius: 7px; }
.stream-viewport { height: 360px; overflow: auto; padding-right: 4px; }
.full-prompt { font-size: 14px; }
.full-prompt .prose > pre { max-height: none; }
.sheet-header .prompt-tabs { margin: 10px 0 0; flex-wrap: nowrap; max-width: 100%; overflow-x: auto; }
.sheet-header .prompt-tabs button { flex: none; }
.prompt-tabs { margin-bottom: 8px; flex-wrap: wrap; }
.prose { line-height: 1.6; overflow-wrap: anywhere; }
.prose > * { max-width: 78ch; } .prose > * + * { margin-top: .65em; }
.prose h3 { font-size: 16px; } .prose h4, .prose h5 { margin-bottom: 0; font-size: 14px; }
.prose ul, .prose ol { padding-left: 21px; margin-bottom: 0; }
.prose blockquote { padding-left: 10px; border-left: 2px solid var(--border); color: var(--secondary); }
.prose hr { border: 0; border-top: 1px solid var(--border); margin-inline: 0; }
code, pre { font-size: .94em; } pre { white-space: pre-wrap; overflow-wrap: anywhere; }
.prose code, .output { background: var(--subtle); border-radius: 4px; }
.prose code { padding: 1px 3px; } .output { padding: 9px; max-height: 240px; overflow: auto; }
.prompt-surface .prose code, .prompt-surface .output { background: var(--surface); border: 1px solid var(--line); }
.prompt-surface .output code { background: transparent; border: 0; padding: 0; }
.skeleton { height: 42px; background: var(--subtle); border-radius: 6px; }
.stream { display: grid; gap: 7px; }
.event { min-width: 0; padding: 9px 10px; border: 1px solid var(--line); border-radius: 7px; }
.stream-heading { min-width: 0; overflow-wrap: break-word; }
.stream-heading > strong { flex: 1; min-width: 0; }
.stream-heading time { font-size: 11px; color: var(--muted); }
.event summary { cursor: pointer; }
.event summary .stream-heading { display: inline-flex; flex: 1; width: calc(100% - 20px); max-width: calc(100% - 20px); vertical-align: middle; }
.stream-heading > .command-title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stream-heading .exit-code { margin-left: auto; }
.stream-icon { color: var(--muted); }
.stream-icon.file_change, .stream-icon.search { color: color-mix(in srgb, var(--accent) 42%, var(--secondary)); }
.stream-icon.report, .stream-icon.command-completed { color: var(--success); }
.stream-icon.error, .stream-icon.command-failed { color: var(--danger); }
.event .prose, .event .chips, .event pre, .report-field, .event details { margin-top: 7px; }
.history-hint { margin-bottom: 10px; }
.report { background: var(--good); border-color: color-mix(in srgb, var(--success) 30%, var(--border)); }
.milestone { font-size: 11.5px; color: var(--secondary); display: flex; align-items: center; gap: 8px; margin: 4px 0; }
.milestone::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.reply { margin: 7px 0; display: flex; gap: 8px; align-items: baseline; overflow-wrap: anywhere; }
#analytics .kpis > div { background: var(--surface); } .export-hint { color: var(--muted); margin-top: 14px; overflow-wrap: anywhere; font-size: 11.5px; }
@media (min-width: 660px) {
  .card-grid { grid-template-columns: repeat(2,minmax(0,1fr)); }
  .kpis { grid-template-columns: repeat(3,minmax(0,1fr)); }
}
@media (min-width: 720px) {
  .config { grid-template-columns: auto minmax(0,1fr) auto minmax(0,1fr); }
  .metrics { grid-template-columns: repeat(4,minmax(0,1fr)); }
}
@media (min-width: 1040px) {
  .card-grid { grid-template-columns: repeat(3,minmax(0,1fr)); }
  .kpis { grid-template-columns: repeat(6,minmax(0,1fr)); }
}
@media (max-width: 360px) {
  .masthead .brand { gap: 4px; }
  #filters button { padding-inline: 7px; }
  .task-card { padding-inline: 10px; } .cancel { padding-inline: 5px; }
  .panel { padding: 11px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<main id="home-layer">
  <header class="masthead">
    <div class="brand">
      <svg class="mark" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M3 18Q13 23 21 5" fill="none" stroke="currentColor" stroke-width="1.1"/>
        <path d="m9 4 1.6 4.4L15 10l-4.4 1.6L9 16l-1.6-4.4L3 10l4.4-1.6zM19 1l.9 2.6L22.5 4.5l-2.6.9L19 8l-.9-2.6-2.6-.9 2.6-.9z" fill="currentColor"/>
      </svg>
      <h1>Codex Castor</h1><span id="preview" class="pill" hidden>Preview</span>
    </div>
    <button id="quota-chip" type="button" class="quota-chip" hidden></button>
  </header>
  <div class="toolbar" id="toolbar">
    <div class="group primary" role="group" aria-label="View">
      <button type="button" id="show-tasks" aria-pressed="true">Tasks</button>
      <button type="button" id="show-analytics" aria-pressed="false">Analytics</button>
    </div>
    <div class="group small-group" id="filters" role="group" aria-label="Filter tasks">
      <button type="button" id="all" aria-pressed="true">All</button>
      <button type="button" id="active-only" aria-pressed="false"><span>Active</span></button>
      <button type="button" id="rated" aria-pressed="false">Rated</button>
      <button type="button" id="unrated" aria-pressed="false">Unrated</button>
    </div>
  </div>
  <p id="notice" class="notice" role="status" hidden></p>
  <div id="tasks">
    <section id="live-section" class="section" hidden><div class="section-head"></div><div class="card-grid"></div></section>
    <section id="project-section" class="section" hidden><div class="section-head"><h2>By Project</h2></div><div id="projects"></div></section>
    <p id="task-empty" class="empty" hidden></p>
  </div>
  <div id="analytics" hidden></div>
</main>
<div id="detail-layer" class="sheet-backdrop level-2" role="dialog" aria-modal="true" aria-label="Session details" hidden>
  <div class="sheet-panel">
    <div id="detail-heading" class="sheet-header"></div>
    <p class="notice" role="status" hidden></p>
    <div id="detail" class="sheet-body"></div>
  </div>
</div>
<div id="sub-layer" class="sheet-backdrop level-3" role="dialog" aria-modal="true" aria-labelledby="sub-title" hidden>
  <div class="sheet-panel">
    <div id="sub-heading" class="sheet-header"></div>
    <p class="notice" role="status" hidden></p>
    <div id="sub-body" class="sheet-body" tabindex="0"></div>
  </div>
</div>
<script>
"use strict";
const protocol = "2026-01-26";
const parentWindow = window.parent;
const preview = parentWindow === window || new URLSearchParams(window.location.search).get("demo") === "1";
const byId = id => document.getElementById(id);
const tasksView = byId("tasks");
const analyticsView = byId("analytics");
const pending = new Map();
const feedbackDrafts = new Map();

function call(name, args) {

    const timeout = setTimeout(() => {
      pending.delete(id);
      post({method: "notifications/cancelled", params: {requestId: id, reason: "Request timed out"}});
      reject(new Error("Request timed out"));
    }, 15000);
    pending.set(id, {resolve, reject, timeout});
    post({id, method: "tools/call", params: {name, arguments: args}});
  });
}

function hostContext(context) {
  const root = document.documentElement;
  if (context?.theme === "dark" || context?.theme === "light") root.dataset.theme = context.theme;
  for (const [key, value] of Object.entries(context?.styles?.variables ?? {})) {
    if (key.startsWith("--")) {
      if (typeof value === "string") root.style.setProperty(key, value);
      else if (value === null) root.style.removeProperty(key);

}

function summaryDetail(task) {

  const round = task.round || 1;
  const kinds = {cmd_start: "command", cmd_done: "command", file: "file_change", message: "message",
    search: "search", tool: "tool", thinking: "reasoning", error: "error"};
  const messages = [];
  for (const activity of task.recent_activities || []) {
    const kind = kinds[activity.kind];
    if (!kind) continue;
    const raw = activity.text || "";
    const exit = raw.match(/^✗\(rc=(-?\d+)\)/);
    const content = (activity.report_summary || raw.replace(/^(?:✗\(rc=[^)]+\)|[▶✓✗✎💬🔎⚙💭⚠])\uFE0F?\s*/u, "")).trim();
    if (!content || content === "turn.failed") continue;
    if (kind === "error" && /is ignoring|--dangerously-bypass-hook-trust/.test(content)) continue;
    const status = kind === "error" || raw.startsWith("✗") ? "failed" :

    const text = kind === "message" && content.startsWith("{") && !activity.report_summary ? "Assistant report" : content;

function setSnapshot(data, {detailOnly = false} = {}) {
  if (!data || !Array.isArray(data.tasks)) return false;
  const now = performance.now();
  const serverTime = Date.parse(data.server_time);
  function withClock(task) {
    const start = Date.parse(task.round_started_at || task.created_at);
    const end = live(task) ? serverTime : Date.parse(task.finished_at || task.updated_at);
    const fallback = Number.isFinite(end - start) ? (end - start) / 1000 : 0;
    return {...task, receivedAt: now, elapsed: Math.max(0, task.elapsed_seconds ?? fallback)};
  }
  if (!detailOnly) tasks = data.tasks.map(withClock);
  if (data.selected_task) {
    const index = tasks.findIndex(task => task.task_id === data.selected_task.task_id);
    const updated = withClock(data.selected_task);
    if (index < 0) tasks.push(updated);
    else tasks[index] = updated;
  } else if (detailOnly && selected) {
    tasks = tasks.filter(task => task.task_id !== selected);
    detail = null;
  }
  count = data.active_count ?? tasks.filter(live).length;
  total = data.total ?? tasks.length;
  analytics = data.analytics;
  if ("quota" in data) quota = data.quota || null;
  telemetryDir = data.telemetry_dir || telemetryDir;
  if (data.task_detail?.task_id === selected) detail = data.task_detail;
  else if (detailOnly && data.selected_task?.task_id === selected) detail = summaryDetail(data.selected_task);
  receivedResult = true;
  if (confirmTask && !tasks.some(task => sameRound(task, confirmTask) && live(task))) clearConfirm();
  if (selected && !detailOnly) renderTasks();
  render();
  return true;
}

function schedule() {
  clearTimeout(pollTimer);
  if (ready && !preview && !disposed && !refreshInFlight) {
    pollTimer = setTimeout(refresh, count > 0 || live(selectedTask()) ? 1000 : 8000);
  }
}

async function refresh() {
  if (preview) { if (selectedTask()) detail = demoDetail(selectedTask()); render(); return; }
  if (!ready || disposed) return;
  if (refreshInFlight) { refreshQueued = true; return; }
  clearTimeout(pollTimer);
  refreshInFlight = true;
  const requestGeneration = generation;
  try {
    const args = selected ? {limit: 0, task_id: selected, include_detail: true} : {limit: 200};
    const result = await call("codex_monitor", args);
    if (disposed || requestGeneration !== generation) return;
    const data = toolPayload(result);
    missingSelected = !!selected && !data?.selected_task;
    if (result?.isError || !setSnapshot(data, {detailOnly: !!args.include_detail})) {
      throw new Error(result?.content?.[0]?.text || "Invalid monitor response");
    }
    showNotice("");
  } catch (error) {
    if (!disposed && requestGeneration === generation) showNotice(`Monitor update failed. ${error.message}`);
  } finally {
    refreshInFlight = false;
    if (refreshQueued && !disposed) {
      refreshQueued = false;
      refresh();
    } else {
      schedule();
    }
  }
}

function renderQuota() {
  const chip = byId("quota-chip");
  const windows = Array.isArray(quota?.windows)
    ? quota.windows.filter(window => Number.isFinite(window?.remaining_percent)) : [];
  chip.hidden = windows.length === 0;
  chip.disabled = refreshingQuota;
  while (chip.childElementCount > windows.length) chip.lastElementChild.remove();
  if (chip.hidden) return;

  const tooltip = [quota.plan_type ? `Codex quota (${quota.plan_type})` : "Codex quota"];
  windows.forEach((window, index) => {
    const remaining = Math.max(0, Math.min(100, window.remaining_percent));
    const color = remaining >= 75 ? "green" : remaining >= 45 ? "blue" : remaining >= 20 ? "yellow" : "red";
    let item = chip.children[index];
    if (!item) {
      item = node("span", "quota-window");
      const meter = node("span", "quota-meter");
      meter.append(node("span", "quota-fill"));
      item.append(node("span", "quota-label"), node("span", "mono"), meter);
      chip.append(item);
    }
    const [label, percentage, meter] = item.children;
    item.className = `quota-window ${color}`;
    label.textContent = window.label;
    percentage.textContent = `${remaining}%`;
    meter.firstElementChild.style.width = `${remaining}%`;

    const reset = new Date(window.resets_at * 1000);
    const resetText = Number.isFinite(window.resets_at) && Number.isFinite(reset.getTime())
      ? `, resets ${reset.toLocaleString()}` : "";
    tooltip.push(`${window.label}: ${remaining}% left (${window.used_percent}% used)${resetText}`);
  });
  const updated = new Date(quota.updated_at);
  if (Number.isFinite(Date.parse(quota.updated_at))) tooltip.push(`Updated ${updated.toLocaleString()}`);
  tooltip.push(refreshingQuota ? "Refreshing quota…" : "Click to refresh");
  chip.title = tooltip.join("\n");
  chip.setAttribute("aria-label", tooltip.join(". "));
}

async function refreshQuota() {
  if (!quota || refreshingQuota || disposed) return;
  if (preview) {
    quota.updated_at = new Date().toISOString();
    renderQuota();
    return;
  }

  refreshingQuota = true;
  renderQuota();
  try {
    const result = await call("codex_monitor", {limit: 0, refresh_quota: true});
    if (disposed) return;
    if (result?.isError) throw new Error(result.content?.[0]?.text || "Tool call failed");
    quota = toolPayload(result)?.quota || null;
  } catch (error) {
    if (!disposed) showNotice(`Quota update failed. ${error.message}`);
  } finally {
    refreshingQuota = false;
    if (!disposed) renderQuota();
  }
}

    if (event.key === "Enter" || event.key === " ") event.stopPropagation();

    task = current;
    const confirm = sameRound(task, confirmTask);
    const label = confirm ? "Confirm" : compact ? "Cancel" : "Cancel task";

    render();

  function edit() {
    feedbackMessages.delete(id);

    if (notes.value !== (values.notes || "")) notes.value = values.notes || "";
    verdict.options[0].disabled = !!feedback.verdict;

    event.preventDefault();

    const args = {task_id: id, notes: sent.notes};
    if (rating) args.rating = rating;
    if (sent.verdict) args.verdict = sent.verdict;
    savingFeedback.add(id);
    update();
    try {
      let saved = {...feedback, ...sent};
      if (!preview) {
        const result = await call("codex_feedback", args);
        saved = toolPayload(result)?.feedback;
        if (result.isError || !saved) throw new Error(toolPayload(result)?.error || "Save failed");
      }
      tasks = tasks.map(t => t.task_id === id ? {...t, feedback: saved} : t);
      if (feedbackDrafts.get(id) === sent) {
        feedbackDrafts.delete(id);
        const message = {text: "Feedback saved."};
        feedbackMessages.set(id, message);
        setTimeout(() => {
          if (feedbackMessages.get(id) === message) { feedbackMessages.delete(id); render(); }

}
function evaluation(task) {
  const section = panel("Evaluation");
  section.append(feedbackForm(task, true), node("div", "replies"));

}
function updateReplies(container, replies) {
  const key = JSON.stringify(replies);
  if (container.renderKey === key) return;
  container.renderKey = key;
  container.replaceChildren();
  if (replies.length) container.append(node("h3", "", "First replies"));
  for (const reply of replies) {
    const row = node("div", "reply");
    row.append(node("span", "pill", "Round " + reply.round), node("blockquote", "", reply.prompt));
    container.append(row);
  }
}
// Keep unchanged sections mounted so polling preserves selections, scroll positions and in-progress edits.
function captureDisclosures(container) {
  for (const el of container.querySelectorAll("[data-open-key]")) {
    if (el.open) detailState.opened.add(el.dataset.openKey);
    else detailState.opened.delete(el.dataset.openKey);
  }
}
function detailSection(id, dependencies, build, parent = detailView) {
  const key = JSON.stringify(dependencies);
  const old = byId(id);
  if (old && sectionKeys.get(id) === key) return old;
  const focusKey = old?.contains(document.activeElement) ? document.activeElement.dataset.focus : null;
  const scrollable = ".prompt-surface, .stream-viewport";
  const viewport = parent.id === "sub-body" ? parent : old?.querySelector(scrollable);
  const scrollTop = viewport?.scrollTop;
  // Anchor the first visible stream item when earlier items change or age out.
  const top = viewport?.getBoundingClientRect().top;
  const anchor = scrollTop && Array.from(old?.querySelectorAll("[data-stream-key]") || [])
    .find(row => row.getBoundingClientRect().bottom > top);
  const anchorTop = anchor ? anchor.getBoundingClientRect().top - top : 0;
  const el = build(); el.id = id;
  if (old) old.replaceWith(el); else parent.append(el);
  sectionKeys.set(id, key);
  if (scrollTop) {
    const scroller = parent.id === "sub-body" ? parent : el.querySelector(scrollable);
    if (scroller) {
      scroller.scrollTop = scrollTop;
      const row = anchor && Array.from(el.querySelectorAll("[data-stream-key]"))
        .find(entry => entry.dataset.streamKey === anchor.dataset.streamKey);
      if (row) scroller.scrollTop += row.getBoundingClientRect().top - scroller.getBoundingClientRect().top - anchorTop;
    }
  }
  if (focusKey) [...el.querySelectorAll("[data-focus]")].find(n => n.dataset.focus === focusKey)?.focus({preventScroll: true});
  return el;
}
function subHeader(task) {
  const header = node("header");
  const bar = node("div", "detail-bar");
  const back = button("Back", () => setSubView(""), "icon-button");
  back.id = "back-sub"; back.dataset.focus = "back-sub"; back.prepend(icon("arrow-left", 14));
  const name = node("div", "detail-name");
  const line = node("div", "row");
  const title = node("h2", "", subView === "prompt" ? "Prompt" : "Message Stream");
  title.id = "sub-title";
  line.append(title);
  if (subView === "stream" && detail) line.append(node("span", "pill", number(detail.total_stream_items)));
  name.append(line, node("p", "muted", task?.task_title || selected));
  bar.append(back, name, subView === "prompt" ? promptControls() : streamControls());
  header.append(bar);
  if (subView === "prompt") appendRoundTabs(header);
  return header;
}
function setSubView(next) {
  const previous = subView;
  if (previous === next) return;
  captureDisclosures(previous ? subLayer : detailView);
  clearConfirm();
  subView = next;
  byId("sub-heading").replaceChildren();
  byId("sub-body").replaceChildren();
  byId("sub-body").scrollTop = 0;
  if (!next) {
    for (const el of detailView.querySelectorAll("[data-open-key]")) el.open = detailState.opened.has(el.dataset.openKey);
  }
  render();
  (next ? byId("back-sub") : byId("expand-" + previous))?.focus({preventScroll: true});
}
function renderDetail(task) {
  const promptKey = [detail?.prompts, detailState.round, detailState.raw];
  const streamKey = [detail?.messages, detail?.total_stream_items, detail?.stderr_tail, detail?.summary_only, detailState.filter];
  if (subView) {
    captureDisclosures(subLayer);
    const prompt = subView === "prompt";
    detailSection("reading-header", [subView, task?.task_title, prompt ? promptKey :
      [detailState.filter, detail?.total_stream_items]], () => subHeader(task), byId("sub-heading"));
    detailSection("reading-body", [subView, prompt ? promptKey : streamKey],
      () => prompt ? promptContent(true) : streamContent(true), byId("sub-body"));
    return;
  }
  captureDisclosures(detailView);
  const header = detailSection("detail-header", [task?.task_id, task?.task_title, task?.status, missingSelected],
    () => detailHeader(task), byId("detail-heading"));
  syncCancel(header, task, false);
  if (!task) {
    detailView.replaceChildren();
    return;
  }
  const c = detail?.config || task;
  const rt = detail?.runtime || task;
  detailSection("configuration", [c.task_id, c.session_id, c.effective_model, c.effective_reasoning_effort, detail?.config],
    () => configuration(c));
  detailSection("runtime", [rt, live(task) && task.receivedAt], () => runtimePanel(task, rt));
  detailSection("prompt", promptKey, promptPanel);
  detailSection("stream", streamKey, streamPanel);
  const panel = detailSection("evaluation", task.task_id, () => evaluation(task));
  panel.querySelector("form").update(task);
  updateReplies(panel.querySelector(".replies"), task.feedback?.user_first_prompts || []);
}
function renderAnalytics() {
  const previousScroll = analyticsView.querySelector(".table-scroll");
  const scrollPosition = previousScroll?.scrollLeft ?? 0;
  const restoreFocus = previousScroll && document.activeElement === previousScroll;
  const overall = analytics?.overall;
  if (!overall) {
    analyticsView.replaceChildren(node("p", "empty", receivedResult ? "No analytics available." : "Connecting to Codex Castor…"));
    return;
  }
  const kpis = node("dl", "kpis");
  for (const [label, value] of [
    ["Total tasks", number(overall.task_count)], ["Completion rate", percent(overall.completion_rate)],
    ["First-pass rate", percent(overall.first_pass_rate)], ["Avg duration", duration(overall.avg_duration_seconds)],
    ["Total tokens", number(overall.total_tokens)], ["Avg rating", number(overall.avg_rating, 2)],
  ]) {

  heading.id = "matrix-heading";

  if (rows.length) {
    const table = node("table", "analytics-table");
    table.setAttribute("aria-labelledby", heading.id);
    const header = table.createTHead().insertRow();
    for (const name of ["Model", "Effort", "Tasks", "Avg Time", "Avg Tokens", "Rework Rate", "Avg Rating"]) {
      const cell = node("th", "", name);
      cell.scope = "col";
      header.append(cell);
    }
    const body = table.createTBody();
    for (const row of rows) {
      const line = body.insertRow();
      for (const value of [row.model, row.reasoning_effort, number(row.task_count),
        duration(row.avg_duration_seconds), number(row.avg_total_tokens), percent(row.rework_rate),
        number(row.avg_rating, 2)]) {
        line.append(node("td", "", value));
      }
    }
    const scroll = node("div", "table-scroll");
    scroll.tabIndex = 0;
    scroll.setAttribute("role", "region");

  } else {
    section.append(node("p", "empty", "No task telemetry yet."));

  const hint = node("p", "export-hint", "Local exports · ");
  for (const [index, file] of ["telemetry.jsonl", "report.md", "telemetry.csv"].entries()) {

    hint.append(node("code", "", `${telemetryDir.replace(/\/$/, "")}/${file}`));
  }
  analyticsView.replaceChildren(kpis, section, hint);
  const scroll = analyticsView.querySelector(".table-scroll");
  if (scroll) {

    if (restoreFocus) scroll.focus({preventScroll: true});

}

function renderFilterCounts() {
  const ratedCount = tasks.filter(isRated).length;
  const unratedCount = tasks.filter(task => !isRated(task)).length;
  byId("all").textContent = `All (${total})`;
  byId("rated").textContent = `Rated (${ratedCount})`;
  byId("unrated").textContent = `Unrated (${unratedCount})`;

  const active = byId("active-only");
  active.lastElementChild.textContent = `Active (${count})`;
  const hasDot = active.childElementCount > 1;
  if (count > 0 && !hasDot) {
    const dot = node("i", "dot running");
    dot.setAttribute("aria-hidden", "true");

function render() {
  renderQuota();
  renderFilterCounts();
  const overlay = view === "detail";
  homeLayer.inert = overlay;
  detailLayer.inert = !!subView;
  detailLayer.hidden = !overlay;
  subLayer.hidden = !subView;
  document.body.classList.toggle("overlay-open", overlay);
  byId("filters").hidden = view === "analytics";
  for (const name of taskFilters) pressed(byId(name), filter === name);
  pressed(byId("show-tasks"), view !== "analytics"); pressed(byId("show-analytics"), view === "analytics");
  tasksView.hidden = view === "analytics"; analyticsView.hidden = view !== "analytics";
  if (view === "tasks") renderTasks();
  else if (view === "analytics") renderAnalytics();
  else renderDetail(selectedTask());

}

function stop() {
  disposed = true;
  clearConfirm();
  clearTimeout(pollTimer);
  clearInterval(tickTimer);
  resizeObserver?.disconnect();
  for (const request of pending.values()) {
    clearTimeout(request.timeout);
    request.reject(new Error("Monitor closed"));
  }
  pending.clear();
}

window.addEventListener("message", event => {
  const msg = event.data;
  if (preview || disposed || event.source !== parentWindow || msg?.jsonrpc !== "2.0") return;
  if (parentOrigin !== "*" && event.origin !== parentOrigin) return;
  if (msg.method === "ping" || msg.method === "ui/resource-teardown") {
    if (msg.id !== undefined) post({id: msg.id, result: {}});
    if (msg.method === "ui/resource-teardown") stop();
  } else if (msg.method === "ui/notifications/host-context-changed") {
    hostContext(msg.params);
  } else if (msg.method === "ui/notifications/tool-input") {
    const candidate = msg.params?.arguments?.task_id;
    const next = typeof candidate === "string" ? candidate : "";
    if (next !== selected) switchView(next ? "detail" : "tasks", next);
  } else if (msg.method === "ui/notifications/tool-result") {
    const data = toolPayload(msg.params);
    const detailOnly = !!data?.selected_task && data.tasks?.length === 0;
    if (msg.params?.isError || !setSnapshot(data, {detailOnly})) {
      showNotice(msg.params?.content?.[0]?.text || "Could not load the monitor result.");
    } else {
      showNotice("");
      if (!selected && data.tasks.length < Math.min(data.total || 0, 200)) refresh();
      else schedule();
    }
  } else if (msg.method === "ui/notifications/tool-cancelled") {
    showNotice(msg.params?.reason || "The host cancelled the initial monitor request.");
  } else if (!msg.method && msg.id === 1 && !ready) {
    if (msg.error) { showNotice(msg.error.message || "Monitor initialization failed."); return; }
    if (event.origin && event.origin !== "null") parentOrigin = event.origin;
    hostContext(msg.result?.hostContext);
    ready = true;
    post({method: "ui/notifications/initialized", params: {}});
    if (typeof ResizeObserver === "function") {
      resizeObserver = new ResizeObserver(() => {
        post({method: "ui/notifications/size-changed", params: {
          width: document.documentElement.clientWidth, height: Math.ceil(document.body.getBoundingClientRect().height),
        }});
      });
      resizeObserver.observe(document.body);
    }
    refresh();
  } else if (!msg.method && pending.has(msg.id)) {
    const request = pending.get(msg.id);
    pending.delete(msg.id);
    clearTimeout(request.timeout);
    if (msg.error) request.reject(new Error(msg.error.message || "Tool call failed"));
    else request.resolve(msg.result);
  }
});

function demoQuota(mode) {
  const now = Date.now();
  const seconds = Math.floor(now / 1000);
  const weekly = {slot: mode === "weekly" ? "primary" : "secondary", label: "7d", used_percent: 78,
    remaining_percent: 22, window_duration_mins: 10080, resets_at: seconds + 190800};
  const hourly = {slot: "primary", label: "5h", used_percent: 16,
    remaining_percent: 84, window_duration_mins: 300, resets_at: seconds + 11520};
  return {updated_at: new Date(now).toISOString(), limit_id: "codex", plan_type: mode === "weekly" ? "prolite" : "pro",
    windows: mode === "weekly" ? [weekly] : [hourly, weekly]};
}

function demoAnalytics(sample) {
  const settled = sample.filter(task => !live(task) && task.status !== "failed");
  const mean = values => values.length ? values.reduce((sum, value) => sum + value, 0) / values.length : null;
  const rates = (numerator, denominator) => denominator ? numerator / denominator : 0;
  const groupStats = tasks => ({
    task_count: tasks.length,
    avg_duration_seconds: mean(tasks.map(task => task.total_duration_seconds ?? task.elapsed_seconds)),
    avg_total_tokens: mean(tasks.map(task => task.total_usage ?? task.usage).filter(Boolean).map(totalTokens)),
    rework_rate: rates(tasks.filter(task => task.rework_count > 0).length, tasks.length),
    avg_rating: mean(tasks.map(task => task.feedback?.rating).filter(value => value != null)),
  });
  const completed = settled.filter(task => task.status === "completed");
  const groups = new Map();
  for (const task of settled) {
    const key = JSON.stringify([task.effective_model, task.effective_reasoning_effort]);
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(task);
  }
  return {
    overall: {
      ...groupStats(settled),
      completion_rate: rates(completed.length, settled.length),
      first_pass_rate: rates(completed.filter(task => !task.rework_count).length, completed.length),
      total_tokens: settled.reduce((sum, task) => sum + totalTokens(task.total_usage ?? task.usage ?? {}), 0),
    },
    by_model_effort: Array.from(groups.values(), group => ({
      model: group[0].effective_model, reasoning_effort: group[0].effective_reasoning_effort, ...groupStats(group),
    })),
  };
}

function demoTasks() {
  const ago = seconds => new Date(Date.now() - seconds * 1000).toISOString();
  const entries = [
    ["live-observability", "Trace live task activity", "Surface the current command and elapsed time while a session is running, including work started in an isolated worktree.",
      "running", 102, 66000, 57000, 1380, "command", "python3 -m unittest discover -s tests -v"],
    ["installer-validation", "Verify installer upgrades", "Exercise upgrades against an existing installation. Preserve user settings and check that the bundled monitor stays available after the upgrade.",
      "completed", 407.18, 1380000, 1251660, 4173, "report", "Upgrade and rollback checks passed with existing settings preserved."],
    ["statusline-cleanup", "Make the status line easier to scan", "Show the session name and elapsed time together. Keep the terminal output readable when the workspace path is long.",
      "completed", 36, 23800, 9200, 460, "report", "The status line now keeps the session name visible in narrow terminals."],
    ["export-validation", "Check the telemetry export", "Compare the exported task ledger with the monthly report and identify any missing records.",
      "failed", 19, 12000, 3100, 300, "error", "The monthly export fixture is missing."]
  ];
  return entries.map(([id, title, prompt, status, seconds, input, cached, output, kind, activity], i) => {
    const start = ago(seconds + i * 570);

    return {task_id: id, task_title: title, prompt_preview: prompt, task_summary: prompt,
      round: i === 1 ? 2 : 1, rework_count: i === 1 ? 1 : 0, status, alive: status === "running",

      effective_model: "gpt-6.2-sol", effective_reasoning_effort: i === 1 ? "xhigh" : "high",
      model_source: "runtime_rollout", reasoning_effort_source: i === 1 ? "override" : "config",
      config_model: "gpt-6.2-sol", config_reasoning_effort: "high", project, requested_workdir: "/workspace/" + project, workdir: "/workspace/" + project,
      worktree_branch: i < 2 ? "codex/" + id : null, created_at: start, round_started_at: i === 1 ? ago(650) : start,
      updated_at: ago(i * 570), finished_at: i ? ago(i * 570) : null,
      elapsed_seconds: i === 1 ? 80 : seconds, total_duration_seconds: i ? seconds : null,
      total_usage: i ? usage : null, usage, event_count: [12, 69, 18, 7][i], exit_code: i ? (i === 3 ? 1 : 0) : null,
      feedback: i === 1 ? {rating: 4, verdict: "accepted", notes: "Verified the upgrade on an existing install.",
        user_first_prompts: [{round: 1, prompt: "Please also cover rollback when the installer is interrupted."},
          {round: 2, prompt: "The upgrade works on my machine too."}]} : {}};
  });
}
function demoDetail(task) {
  const id = task.task_id;
  const multi = task.round > 1;
  const firstPrompt = "# " + task.task_title + "\n\n" + task.prompt_preview + "\n\n## Verification\n\n" +
    "- Run the focused checks in the project workspace.\n- Record the results in the **final report**.";
  const prompts = [{round: 1, kind: "dispatch", filename: "spec.md", text: firstPrompt, truncated: false}];
  if (multi) prompts[0].text += [
    "", "## Existing installations", "Start with a workspace that already contains a customized configuration. " +
    "Record the settings before the upgrade so the test can compare individual values afterward.",
    "", "### Upgrade checks", "1. Install the earlier release in a temporary home directory.",
    "2. Add a project-specific setting and an unrelated server entry.",
    "3. Run the upgrade twice and compare the generated configuration after each run.",
    "", "### Resource checks", "Read the bundled monitor through the local MCP server and verify the resource type.",
    "", "```sh", "python3 scripts/doctor.py --repo-only", "```", "", "---",
    "> Keep all installation fixtures inside the temporary workspace.", "",
    "## Acceptance", "The second upgrade must preserve the same settings as the first. " +
    "Record the checks in the report and list any files that need manual recovery."
  ].join("\n");
  if (multi) prompts.push({round: 2, kind: "resume", filename: "feedback-r2.md", truncated: false,
    text: "## Verify rollback\n\n> Please also cover rollback when the installer is interrupted.\n\n1. Start with an existing install.\n2. Interrupt the upgrade.\n3. Check that the original settings remain intact.\n\n```sh\npython3 scripts/doctor.py --repo-only\n```"});
  const messages = [];
  const add = (round, kind, title, body = "", meta = {}, status = "completed") =>
    messages.push({round, kind, title, body, meta, status});
  const rounds = [];
  for (const p of prompts) {
    const last = p.round === task.round;
    const usage = Object.fromEntries(Object.entries(task.usage).map(([k,v]) =>
      [k, multi ? (last ? Math.ceil(v / 2) : Math.floor(v / 2)) : v]));
    usage.total_tokens = usage.input_tokens + usage.output_tokens;
    rounds.push({round: p.round, kind: p.kind, prompt_file: p.filename, model: task.effective_model,
      reasoning_effort: task.effective_reasoning_effort, duration_seconds: multi ? (last ? 80 : 327.18) : task.elapsed_seconds,
      status: last ? task.status : "completed", usage, started_at: p.round === 1 ? task.created_at : task.round_started_at,
      finished_at: last ? task.finished_at : task.round_started_at});
    if (multi) add(p.round, "round_start", "Round " + p.round + " · " + cap(p.kind));
    if (multi && !last) {
      add(p.round, "reasoning", "Reasoning", "Compare the settings before and after a second installation.");
      add(p.round, "tool", "read_resource", "", {server: "workspace", tool: "read_resource"});
      add(p.round, "search", "Installer rollback semantics", "", {queries: ["Installer rollback semantics"]});
    }
    add(p.round, "message", "Assistant", last && multi ? "I’ll check rollback against the existing installation." :
      "I’ll start by checking the relevant fixtures and the current implementation.");
    if (multi) add(p.round, "file_change", "Changed 2 files", "", {files: [
      {kind: "update", path: "scripts/install.py"}, {kind: "update", path: "tests/test_install_and_doctor.py"}]});
    const cmd = multi ? "python3 scripts/doctor.py --repo-only" : task.alive ?
      task.latest_activity.text : "python3 -m unittest discover -s tests";
    add(p.round, "command", cmd, task.alive ? "" : task.status === "failed" ? "FileNotFoundError: monthly.jsonl" :
      "Checking task artifacts…\nAll checks passed.", {command: cmd, exit_code: last ? task.exit_code : 0}, last ? task.status : "completed");
    if (task.status === "failed") add(p.round, "error", "Error", task.latest_activity.text, {}, "failed");
    if (task.status === "completed") {
      if (last) add(p.round, "report", "Final Report", task.latest_activity.text,
        {status: "completed", summary: task.latest_activity.text, files_changed: multi ? ["scripts/install.py", "tests/test_install_and_doctor.py"] :
          ["scripts/statusline.py"], commands_run: [cmd], tests_summary: "All targeted checks passed.", open_issues: []});
      add(p.round, "turn_status", "Turn completed", "", {usage});
    }
  }
  const config = {...task, effective_workdir: task.workdir, requested_workdir: task.workdir,
    worktree_enabled: !!task.worktree_branch, round_count: task.round};
  return {task_id: id, task_title: task.task_title, config, runtime: {...task, rounds,
    total_duration_seconds: task.total_duration_seconds ?? task.elapsed_seconds}, prompts, messages,
    total_stream_items: messages.length, messages_truncated: false,
    stderr_tail: task.status === "failed" ? "FileNotFoundError: fixtures/monthly.jsonl\nExport check exited with code 1." : ""};
}

byId("quota-chip").addEventListener("click", refreshQuota);
for (const name of ["tasks", "analytics"]) byId("show-" + name).addEventListener("click", () => switchView(name));
for (const name of taskFilters) byId(name).addEventListener("click", () => {
  filter = name; render();
});
document.addEventListener("keydown", event => {
  if (event.key === "Tab" && selected) {
    const layer = subView ? subLayer : detailLayer;
    const controls = [...layer.querySelectorAll("button, input, select, textarea, summary, [tabindex]")]
      .filter(el => el.tabIndex >= 0 && !el.disabled && el.getClientRects().length);
    const first = controls[0], last = controls.at(-1);
    if (event.shiftKey && document.activeElement === first || !event.shiftKey && document.activeElement === last) {
      event.preventDefault();
      (event.shiftKey ? last : first).focus();
    }
    return;
  }
  if (event.key !== "Escape" || event.target.closest("input, select, textarea")) return;
  if (confirmTask) { clearConfirm(); render(); }
  else if (subView) setSubView("");
  else if (view === "detail") switchView("tasks");
});
detailLayer.addEventListener("click", event => {
  if (event.target === detailLayer) switchView("tasks");
});
subLayer.addEventListener("click", event => {
  if (event.target === subLayer) setSubView("");
});
tickTimer = setInterval(tick, 1000);
if (preview) {
  byId("preview").hidden = false;
  const params = new URLSearchParams(location.search);
  const theme = params.get("theme");
  const media = window.matchMedia("(prefers-color-scheme: dark)");
  const applyTheme = () => hostContext({theme: ["light", "dark"].includes(theme) ? theme : media.matches ? "dark" : "light"});
  media.addEventListener("change", applyTheme);
  applyTheme();
  const sample = demoTasks();
  setSnapshot({server_time: new Date().toISOString(), tasks: sample, analytics: demoAnalytics(sample),
    quota: demoQuota(params.get("quota"))});
  if (sample.some(t => t.task_id === params.get("task"))) {
    switchView("detail", params.get("task"));
    if (["prompt", "stream"].includes(params.get("sub"))) setSubView(params.get("sub"));
  }
} else {
  render();
  post({id: 1, method: "ui/initialize", params: {
    appInfo: {name: "codex-castor-monitor", version: "1.1.0"},
    appCapabilities: {availableDisplayModes: ["inline"]}, protocolVersion: protocol,
  }});
}
